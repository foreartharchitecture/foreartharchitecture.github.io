<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Setup keys · Forearth Studio</title><meta name="robots" content="noindex">
<style>
:root{--bg:#101311;--sheet:#161a17;--rule:#3b433d;--ink:#ebe8dd;--ink3:#7f847a;color-scheme:dark}
@media (prefers-color-scheme: light){:root{--bg:#ecebe4;--sheet:#fbfaf5;--rule:#c3c1b5;--ink:#181915;--ink3:#787a71;color-scheme:light}}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px 16px}
main{max-width:620px;margin:0 auto;background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:20px}
h1{font-size:20px;margin:0 0 6px}p{margin:0 0 14px;color:var(--ink3)}
.k{display:grid;gap:6px;margin:0 0 16px}.k b{font-size:13px;letter-spacing:.06em}
.row{display:flex;gap:8px}code{flex:1;min-width:0;overflow-wrap:anywhere;font:13px/1.4 ui-monospace,Menlo,Consolas,monospace;border:1px solid var(--rule);border-radius:4px;padding:9px 10px;user-select:all}
button{border:1px solid var(--rule);background:none;color:inherit;border-radius:4px;padding:0 12px;font:inherit;font-size:13px;cursor:pointer}
</style></head><body><main>
<h1>Setup keys</h1>
<p>Random values made on this device for the Forearth Studio setup. Nothing is sent anywhere. Reload for new values.</p>
<div class="k"><b>SESSION_SECRET</b><div class="row"><code id="s"></code><button data-c="s">Copy</button></div></div>
<div class="k"><b>SETUP_CODE</b> <span style="color:var(--ink3);font-size:13px">(founders type this once at Founder setup; also resets a founder password)</span><div class="row"><code id="c"></code><button data-c="c">Copy</button></div></div>
<div class="k"><b>MAIL_KEY</b> <span style="color:var(--ink3);font-size:13px">(only needed later, when you connect Gmail for emailed codes)</span><div class="row"><code id="m"></code><button data-c="m">Copy</button></div></div>
</main><script src="/keygen.js"></script></body></html>
