# Forearth Studio — Cloudflare Worker configuration.
# Secrets (NOTION_TOKEN, GOOGLE_SA_KEY, MAIL_URL, MAIL_KEY, SESSION_SECRET, FOUNDER_EMAILS,
# optional ANTHROPIC_API_KEY) are added in the Cloudflare dashboard, never in this file.
name = "forearth-studio"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true
preview_urls = false

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"
not_found_handling = "none"

[[durable_objects.bindings]]
name = "STORE"
class_name = "Store"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Store"]

[observability]
enabled = true
